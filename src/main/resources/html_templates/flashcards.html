<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards</title>
    <style>
        $stylesheet
    </style>
</head>
<body>
<div class="content-wrapper">
    <div class="intro-text">This application stores all your flashcard files.</div>

    <div class="collections-header"><strong>All Your Collections:</strong></div>
    <div class="collections-list">
        <ul>$collections</ul>
    </div>

    <form class="button-container" method="post" enctype="multipart/form-data">
        <label for="file-upload" class="button">
            Import Collection
        </label>
        <input id="file-upload" name="file" type="file" onchange="this.form.submit()"/>
    </form>
</div>
</body>
</html>
