<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$collectionName - Flashcards</title>
    <style>
        $stylesheet
    </style>
</head>
<body>
    <a href="/flashcards/collections" class="back-link">← Back to Collections</a>
    <h1 class="collection-title">$collectionName</h1>

    <table class="flashcards-table">
        <thead>
            <tr>
                <th>#</th>
                <th>Front</th>
                <th>Back</th>
            </tr>
        </thead>
        <tbody>
            $flashcards
        </tbody>
    </table>

    <div class="action-buttons">
        <button class="delete-btn" onclick="deleteCollection()">Delete Collection</button>
    </div>

    <script>
        function deleteCollection() {
            fetch(window.location.pathname, {
                method: 'DELETE',
            })
            .then(response => {
                if (response.redirected) {
                    window.location.href = response.url;
                }
            })

<!--            .then(response => {-->
<!--                if (response.status === 303) {-->
<!--                    // Follow the redirect from the server-->
<!--                    const redirectUrl = response.headers.get('Location');-->
<!--                    window.location.href = redirectUrl || '/flashcards/collections';-->
<!--                } else {-->
<!--                    // Handle unexpected status codes-->
<!--                    return response.text().then(error => {-->
<!--                        console.error('Error status:', response.status, 'Response:', error);-->
<!--                        alert('Failed to delete collection. Status: ' + response.status);-->
<!--                    });-->
<!--                }-->
<!--            })-->
        }
    </script>
</body>
</html>
