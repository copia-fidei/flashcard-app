<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$collectionName - Flashcards</title>
    <style>
        $stylesheet
    </style>
</head>
<body>
    <a href="/flashcards" class="back-link">← Back to Collections</a>
    <h1 class="collection-title">$collectionName</h1>

    <table class="flashcards-table">
        <thead>
            <tr>
                <th>#</th>
                <th>Front</th>
                <th>Back</th>
            </tr>
        </thead>
        <tbody>
            $flashcards
        </tbody>
    </table>

    <div class="action-buttons">
        <button class="delete-btn" onclick="deleteCollection()">Delete Collection</button>
    </div>

    <script>
        function deleteCollection() {
            if (!confirm('Are you sure you want to delete this collection? This action cannot be undone.')) {
                return;
            }

            fetch(window.location.pathname, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'text/plain'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.text();
            })
            .then(message => {
                alert(message);
                window.location.href = '/flashcards';
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Failed to delete collection: ' + error.message);
            });
        }
    </script>
</body>
</html>
