import aQute.bnd.gradle.Bundle

plugins {
    id 'java'
    id "biz.aQute.bnd.builder"
}

def karafDeployPath = file(System.env.HOME + "/.local/bin/apache-karaf-4.4.8/deploy")

// Latest compatible Java version that works with Jersey 2.30.1 and Karaf.
java.sourceCompatibility = JavaVersion.VERSION_11

group = 'web.flashcards'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

configurations {
    warlib {
        transitive = false
    }
    bundleDep {
        transitive = false
    }
}


tasks.register('downloadWarLibs', Copy) {
    from configurations.warlib
    into 'build/libs'
    duplicatesStrategy 'exclude'
}

tasks.register('deployBundleDependenciesIntoKaraf', Copy) {
    from configurations.bundleDep
    into karafDeployPath
    duplicatesStrategy 'exclude'
}

dependencies {
    compileOnly 'javax.servlet:javax.servlet-api:3.0.1'
    compileOnly 'jakarta.json:jakarta.json-api:2.1.3'
    compileOnly 'jakarta.json.bind:jakarta.json.bind-api:3.0.1'
    compileOnly 'javax.xml.bind:jaxb-api:2.3.1'

    implementation 'org.glassfish.jersey.containers:jersey-container-servlet-core:2.30.1'
    compileOnly 'org.glassfish.jersey.media:jersey-media-multipart:2.30.1'


    bundleDep 'org.glassfish.jersey.media:jersey-media-multipart:2.30.1'
    bundleDep 'jakarta.json.bind:jakarta.json.bind-api:3.0.1'
    bundleDep 'jakarta.json:jakarta.json-api:2.1.3'
    bundleDep 'javax.validation:validation-api:2.0.1.Final'
    bundleDep 'org.eclipse:yasson:3.0.4'
    bundleDep 'org.jvnet.mimepull:mimepull:1.9.11'

    warlib 'org.eclipse.parsson:parsson:1.1.7'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Include this, otherwise you get this warning:     [enum]  This API is incompatible with the configuration cache, which will become the only mode supported by Gradle in a future release.
tasks.named("jar") {
    bundle {
        properties.empty
    }
}
tasks.register("bundle", Bundle) {
    dependsOn('deployBundleDependenciesIntoKaraf', 'downloadWarLibs')

    from sourceSets.main.output
    bundle {
        bnd '''
Export-Package: flashcard.app.*
Import-Package: org.glassfish.jersey.servlet, *

Web-ContextPath: /flashcards
//-includeresource: src/main/resources
-wab: src/main/webapp
// INFO: Surprisingly, the 'parson' bundle has to be included into the lib folder of the war. It cannot be deployed like the other bundles.
// Otherwise you get this error: jakarta.json.JsonException: Provider org.eclipse.parsson.JsonProviderImpl not found
-wablib: build/libs/parsson-1.1.7.jar

'''
        archiveBaseName = 'flashcards'
        archiveAppendix = ''
        archiveClassifier = ''
        archiveVersion = ''
        destinationDirectory = karafDeployPath

        outputs.upToDateWhen { false }
    }
}

test {
    useJUnitPlatform()
}