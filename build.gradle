import aQute.bnd.gradle.Bundle

plugins {
    id 'java'
    id 'biz.aQute.bnd.builder'
}


java.sourceCompatibility = JavaVersion.VERSION_21

group = 'com.epau.app'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'javax.servlet:javax.servlet-api:3.0.1'
    compileOnly 'org.glassfish.jersey.media:jersey-media-multipart:2.47'
    compileOnly 'org.glassfish.jersey.ext:jersey-mvc-mustache:2.47'

    //compileOnly 'org.osgi:org.osgi.service.component.annotations:1.4.0'

    // Test
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.xerial:sqlite-jdbc:3.45.2.0'
    testRuntimeOnly 'org.postgresql:postgresql:42.7.14'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Include this, otherwise you get this warning:
// [enum]  This API is incompatible with the configuration cache, which will become the only mode supported by Gradle in a future release.
tasks.named('jar') {
    bundle {
        properties.empty
    }
}


tasks.register('bundle', Bundle) {
    from sourceSets.main.output
    bundle {
        bnd '''
Export-Package: flashcard.app.*
Import-Package: org.glassfish.jersey.servlet, org.sqlite, org.postgresql, * 

Web-ContextPath: /flashcards
//-includeresource: src/main/resources
-wab: src/main/webapp
'''
        outputs.upToDateWhen { false }
    }
}

tasks.register('deploy_to_Karaf', Copy) {
    group = 'Deploy'
    def bundleTask = tasks.named('bundle')
    dependsOn(bundleTask)
    from(bundleTask)
    // Change this to the /deploy folder of your Karaf.
    into(file(System.env.HOME + '/.local/bin/apache-karaf-4.4.8/deploy'))
}

test {
    useJUnitPlatform()
}